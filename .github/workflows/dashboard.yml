# This repository's own dashboard, published by the Action it contains.
name: Dashboard

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read
  deployments: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
