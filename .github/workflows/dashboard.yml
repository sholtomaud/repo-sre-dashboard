# This repository's own dashboard, published by the Action it contains.
# It redeploys whenever CI passes on main, so a merged change to the
# dashboard goes live by itself, and every six hours for fresh data.
name: Dashboard

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the audit opens and closes its own issues
  pull-requests: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # After CI, only when it passed: a red main is never published.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dashboard.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dashboard
        uses: ./
        with:
          audit-issues: true
          agent-cost-per-issue: '1.50'
          human-hourly-rate: '95'
          human-hours-per-issue: '2'
          monthly-human-budget: '5000'
          monthly-agentic-budget: '50'
          currency: USD
