# Release Please keeps a release pull request open from the commit titles on
# main (use Conventional Commit titles: "feat: …", "fix: …"). Merging it
# tags the release, and this workflow moves the major tag (v1) to it, so
# `uses: sholtomaud/repo-sre-dashboard@v1` picks it up.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      - if: steps.release.outputs.release_created
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the major tag
        if: steps.release.outputs.release_created
        env:
          MAJOR: v${{ steps.release.outputs.major }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
