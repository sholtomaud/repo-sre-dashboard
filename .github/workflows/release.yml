# Release Please keeps a release pull request open from the commit titles on
# main (use Conventional Commit titles: "feat: …", "fix: …"). Merging it
# tags the release (v1.2.3), and this workflow moves the major tag (v1) to
# it, so `uses: sholtomaud/repo-sre-dashboard@v1` picks it up.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      # Points v<major> at the release's commit through the API: no checkout,
      # so nothing depends on which tags a clone fetched.
      - name: Move the major tag
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: v${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" \
            -f sha="$SHA" -F force=true ||
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$MAJOR" -f sha="$SHA"
          echo "$MAJOR -> $SHA"
