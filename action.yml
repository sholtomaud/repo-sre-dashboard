name: Repo SRE Dashboard
description: >-
  Publishes a repository health dashboard to GitHub Pages: issues and pull
  requests by AI agents and people, DORA delivery metrics and CI health, a
  simulated outlook, the codebase, and a best-practice audit with fixes to
  copy.
author: Sholto Maud
branding:
  icon: activity
  color: orange

inputs:
  token:
    description: Token for reading the repository and pushing to the Pages branch.
    default: ${{ github.token }}
  path:
    description: Folder of the site to publish to, so the dashboard is at /<repository>/<path>/. Use . for the site's root.
    default: dashboard
  publish-to:
    description: >-
      How to publish. "pages" (the default) uploads and deploys with GitHub's
      Pages actions (set Settings → Pages → Source to "GitHub Actions", and
      give the job pages: write and id-token: write). "artifact" uploads the
      Pages artifact without deploying, so a separate deploy job can run
      actions/deploy-pages. "branch" commits to the branch named below beside
      any existing site. "branch-artifact" commits to the branch, strips .git,
      and uploads the combined directory as a Pages artifact for a separate
      actions/deploy-pages job.
    default: pages
  branch:
    description: With publish-to branch or branch-artifact, the Pages branch. Created if it does not exist.
    default: gh-pages
  title:
    description: The dashboard's title. Defaults to the repository's name.
    default: ''
  agent-logins:
    description: Extra GitHub logins to count as AI agents, comma or space separated. Bot accounts and logins such as copilot or claude are recognised already.
    default: ''
  queue-repository:
    description: For a file-based issue queue, the repository that holds it (owner/name). Defaults to this repository.
    default: ''
  queue-open-dir:
    description: For a file-based issue queue, the folder of open issues. Leave empty for none.
    default: ''
  queue-resolved-dir:
    description: For a file-based issue queue, the folder of resolved issues.
    default: ''
  queue-name:
    description: The file-based queue's name on the dashboard.
    default: "Agents' own queue"
  audit-issues:
    description: >-
      Set to true to open an issue for each audit finding, labelled
      repo-sre-audit. Issues are updated as findings change, closed when the
      check passes and reopened if it fails again; they are left out of the
      dashboard's issue figures. Needs issues: write.
    default: 'false'
  audit-issues-impact:
    description: With audit-issues, the lowest impact that gets an issue (high, medium or low).
    default: medium
  security-days:
    description: Manageability limit for security issues, in days (decimals allowed, e.g. 0.5 for 12 hours). A repository is unmanageable once a new issue of any class would wait longer than its limit.
    default: '7'
  bug-days:
    description: Manageability limit for bug reports, in days.
    default: '30'
  feature-days:
    description: Manageability limit for feature requests and other issues, in days.
    default: '180'
  agent-cost-per-issue:
    description: Optional. What an AI agent costs per issue it resolves. Cost figures appear only once this or human-hourly-rate is set.
    default: ''
  human-hourly-rate:
    description: Optional. What an hour of a person's time costs.
    default: ''
  human-hours-per-issue:
    description: Optional. Hours a person spends per resolved issue.
    default: '2'
  monthly-human-budget:
    description: Optional. Monthly budget for people's time resolving issues; the dashboard forecasts when keeping pace would exceed it.
    default: ''
  monthly-agentic-budget:
    description: Optional. Monthly budget for what agents spend resolving issues (API and CI); the dashboard forecasts when keeping pace would exceed it.
    default: ''
  monthly-budget:
    description: Deprecated; use monthly-human-budget, which it stands in for until then.
    deprecationMessage: monthly-budget is deprecated. Rename it monthly-human-budget, and set monthly-agentic-budget for what agents may spend.
    default: ''
  currency:
    description: Currency code for the cost figures.
    default: USD
  why:
    description: Optional note on why this repository is tracked, shown on the methodology page.
    default: ''
  why-url:
    description: Optional link for the note.
    default: ''

outputs:
  url:
    description: Where the dashboard is published.
    value: ${{ steps.site.outputs.url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Prepare the site
      shell: bash
      env:
        SRE_TOKEN: ${{ inputs.token }}
        SRE_PUBLISH_TO: ${{ inputs.publish-to }}
        SRE_BRANCH: ${{ inputs.branch }}
        SRE_PATH: ${{ inputs.path }}
        SRE_QUEUE_OPEN_DIR: ${{ inputs.queue-open-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare.sh"

    - name: Collect the data
      shell: bash
      env:
        SRE_TOKEN: ${{ inputs.token }}
        SRE_DATA_DIR: ${{ runner.temp }}/sre-pages/${{ inputs.path }}/data
        SRE_TITLE: ${{ inputs.title }}
        SRE_AGENT_LOGINS: ${{ inputs.agent-logins }}
        SRE_QUEUE_REPOSITORY: ${{ inputs.queue-repository }}
        SRE_QUEUE_OPEN_DIR: ${{ inputs.queue-open-dir }}
        SRE_QUEUE_RESOLVED_DIR: ${{ inputs.queue-resolved-dir }}
        SRE_QUEUE_NAME: ${{ inputs.queue-name }}
        SRE_SECURITY_DAYS: ${{ inputs.security-days }}
        SRE_BUG_DAYS: ${{ inputs.bug-days }}
        SRE_FEATURE_DAYS: ${{ inputs.feature-days }}
        SRE_AGENT_COST_PER_ISSUE: ${{ inputs.agent-cost-per-issue }}
        SRE_HUMAN_HOURLY_RATE: ${{ inputs.human-hourly-rate }}
        SRE_HUMAN_HOURS_PER_ISSUE: ${{ inputs.human-hours-per-issue }}
        SRE_MONTHLY_BUDGET: ${{ inputs.monthly-budget }}
        SRE_MONTHLY_HUMAN_BUDGET: ${{ inputs.monthly-human-budget }}
        SRE_MONTHLY_AGENTIC_BUDGET: ${{ inputs.monthly-agentic-budget }}
        SRE_CURRENCY: ${{ inputs.currency }}
        SRE_WHY_TEXT: ${{ inputs.why }}
        SRE_WHY_URL: ${{ inputs.why-url }}
        SRE_AUDIT_ISSUES: ${{ inputs.audit-issues }}
        SRE_AUDIT_ISSUES_IMPACT: ${{ inputs.audit-issues-impact }}
      run: node "$GITHUB_ACTION_PATH/tracker/src/main.ts"

    - name: Assemble the site
      id: site
      shell: bash
      env:
        SRE_TOKEN: ${{ inputs.token }}
        SRE_PUBLISH_TO: ${{ inputs.publish-to }}
        SRE_PATH: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/scripts/assemble.sh"

    - name: Push to the Pages branch
      if: inputs.publish-to == 'branch' || inputs.publish-to == 'branch-artifact'
      shell: bash
      env:
        SRE_PATH: ${{ inputs.path }}
        SRE_BRANCH: ${{ inputs.branch }}
      run: bash "$GITHUB_ACTION_PATH/scripts/publish.sh"

    - name: Strip git metadata before Pages upload
      if: inputs.publish-to == 'branch-artifact'
      shell: bash
      run: rm -rf "${{ runner.temp }}/sre-pages/.git"

    - name: Upload the site
      if: inputs.publish-to != 'branch'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ runner.temp }}/sre-pages

    - name: Wait for Pages artifact
      if: inputs.publish-to == 'pages'
      shell: bash
      env:
        SRE_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/wait-for-artifact.sh"

    - name: Deploy to GitHub Pages
      if: inputs.publish-to == 'pages'
      id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    - name: Summary
      shell: bash
      env:
        URL: ${{ steps.site.outputs.url }}
        PUBLISH_TO: ${{ inputs.publish-to }}
        BRANCH: ${{ inputs.branch }}
      run: |
        echo "### Dashboard: $URL" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$PUBLISH_TO" == branch ]]; then
          echo "If the page is not live, set Settings → Pages → Source to \"Deploy from a branch\", branch \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
        fi
